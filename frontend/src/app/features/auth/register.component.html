<div class="auth-page auth-register">
  <section class="auth-card">
    <header class="card-topbar">
      <a class="brand" routerLink="/">
        <span class="brand-mark"></span>
        <span class="brand-text">LOGO</span>
      </a>

      <nav class="mini-nav" aria-label="Auth navigation">
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link">Features</a>
        <a href="#" class="nav-link">Pricing</a>
      </nav>

      <a routerLink="/login" class="top-cta">Log In</a>
    </header>

    <div class="card-body register-layout">
      <div class="hero-pane" aria-hidden="true">
        <img
          src="assets/landing/auth-register-hero.svg"
          alt=""
          class="hero-main"
        />
      </div>

      <div class="auth-pane">
        <h1>Create <span>Account</span></h1>
        <p class="subtitle">Grow &amp; Manage Your Business</p>
        <div class="accent-line"></div>

        <form (ngSubmit)="submit()" class="auth-form">
          <label class="input-label">Full Name</label>
          <div class="input-wrap">
            <span class="input-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
                />
              </svg>
            </span>
            <input
              [(ngModel)]="fullName"
              name="fullName"
              type="text"
              placeholder="Enter your full name"
              required
            />
          </div>

          <label class="input-label">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
                />
              </svg>
            </span>
            <input
              [(ngModel)]="email"
              name="email"
              type="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <label class="input-label">Phone Number</label>
          <div class="input-wrap">
            <span class="input-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 0 0 2.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 0 1-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 0 0-1.091-.852H4.5A2.25 2.25 0 0 0 2.25 4.5v2.25Z"
                />
              </svg>
            </span>
            <input
              [(ngModel)]="phone"
              name="phone"
              type="tel"
              placeholder="Enter your phone number"
            />
          </div>

          <label class="input-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z"
                />
              </svg>
            </span>
            <input
              [(ngModel)]="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              required
            />
            <button
              type="button"
              class="eye-btn"
              (click)="showPassword = !showPassword"
              aria-label="Toggle password visibility"
            >
              &#128065;
            </button>
          </div>

          <button type="submit" class="primary-btn">
            Create Account <span>&#8594;</span>
          </button>

          <p class="divider"><span>Or sign up with</span></p>
          <div class="social-row">
            <button type="button" class="social-btn">
              <span class="social-g">G</span> Google
            </button>
            <button type="button" class="social-btn">
              <span class="social-f">f</span> Facebook
            </button>
          </div>

          <p class="error" *ngIf="error">{{ error }}</p>
        </form>
      </div>

      <div class="bottom-art" aria-hidden="true">
        <img src="assets/landing/auth-register-bottom.svg" alt="" />
      </div>
    </div>
  </section>
</div>
