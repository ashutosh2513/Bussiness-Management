<div class="auth-page auth-login">
  <section class="auth-card">
    <header class="card-topbar">
      <a class="brand" routerLink="/">
        <span class="brand-mark"></span>
        <span class="brand-text">LOGO</span>
      </a>

      <nav class="mini-nav" aria-label="Auth navigation">
        <a href="#" class="nav-link">Home</a>
        <a href="#" class="nav-link">Features</a>
        <a href="#" class="nav-link">Pricing</a>
        <a href="#" class="nav-link">Contact</a>
      </nav>

      <a routerLink="/register" class="top-cta">Sign Up</a>
    </header>

    <div class="card-body two-col">
      <div class="auth-pane">
        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to <span>Manage Your Business</span></p>
        <div class="accent-line"></div>

        <form (ngSubmit)="submit()" class="auth-form">
          <label class="input-label">Email Address</label>
          <div class="input-wrap">
            <span class="input-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"
                />
              </svg>
            </span>
            <input
              [(ngModel)]="email"
              name="email"
              type="email"
              placeholder="Enter your email"
              required
            />
          </div>

          <label class="input-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z"
                />
              </svg>
            </span>
            <input
              [(ngModel)]="password"
              name="password"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              required
            />
            <button
              type="button"
              class="eye-btn"
              (click)="showPassword = !showPassword"
              aria-label="Toggle password visibility"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-5"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                />
              </svg>
            </button>
          </div>

          <button type="submit" class="primary-btn">
            Login <span>&#8594;</span>
          </button>

          <div class="row-between options-row">
            <label class="check-wrap">
              <input
                [(ngModel)]="rememberMe"
                name="rememberMe"
                type="checkbox"
              />
              <span>Remember Me</span>
            </label>
            <a href="#" class="help-link"><strong>Forgot Password</strong></a>
          </div>

          <p class="divider"><span>Or continue with</span></p>

          <div class="social-row">
            <button type="button" class="social-btn">
              <span class="social-g">G</span> Google
            </button>
            <button type="button" class="social-btn">
              <span class="social-f">f</span> Facebook
            </button>
          </div>

          <p class="error" *ngIf="error">{{ error }}</p>
        </form>
      </div>

      <div class="art-pane" aria-hidden="true">
        <img src="assets/landing/image_01.png" alt="" />
      </div>
    </div>
  </section>
</div>
